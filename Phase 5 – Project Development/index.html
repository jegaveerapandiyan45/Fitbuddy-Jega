<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FitBuddy - AI Workout Generator</title><style>
body{margin:0;font-family:Arial,sans-serif;min-height:100vh;background:linear-gradient(135deg,#0f172a,#164e63);color:white}.card{max-width:620px;margin:35px auto;padding:30px;background:rgba(255,255,255,.10);border-radius:18px;box-shadow:0 12px 35px rgba(0,0,0,.25)}h1{text-align:center}.sub{text-align:center;color:#dbeafe}label{display:block;margin:13px 0 6px;font-weight:bold}input,select,textarea{width:100%;box-sizing:border-box;padding:12px;border:0;border-radius:9px}button{width:100%;padding:13px;margin-top:20px;border:0;border-radius:9px;background:#22c55e;color:#fff;font-weight:bold;cursor:pointer}.error{padding:12px;background:#7f1d1d;border-radius:8px}.links{text-align:center;margin-top:18px}.links a{color:#bfdbfe}.note{font-size:13px;color:#cbd5e1;line-height:1.5}</style></head><body><div class="card"><h1>🏋️ FitBuddy</h1><p class="sub">AI Fitness Plan Generator using Gemini</p>{% if error %}<div class="error">{{ error }}</div>{% endif %}<form action="/generate-workout" method="post"><label>Name</label><input name="username" required placeholder="Enter your name"><label>User ID</label><input name="user_id" required placeholder="FB001"><label>Age</label><input name="age" type="number" min="10" max="100" required><label>Weight (kg)</label><input name="weight" type="number" min="20" max="300" step="0.1" required><label>Fitness Goal</label><select name="goal"><option>weight loss</option><option>muscle gain</option><option>general wellness</option><option>flexibility</option><option>fitness improvement</option></select><label>Workout Intensity</label><select name="intensity"><option>low</option><option selected>medium</option><option>high</option></select><button>Generate Plan</button></form><div class="links"><a href="/view-all-users">View All Users / Admin</a></div><p class="note">FitBuddy provides general fitness information and is not a medical diagnosis or treatment system.</p></div></body></html>
